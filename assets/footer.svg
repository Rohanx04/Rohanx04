<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="Thanks for scrolling">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c5364"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#0f2027"/>
    </linearGradient>
    <clipPath id="fclip"><rect width="900" height="110" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#fclip)">
    <rect width="900" height="110" fill="url(#fbg)"/>
    <path fill="#00c2ff" fill-opacity="0.16"
          d="M0 46 q112 -26 225 0 t225 0 t225 0 t225 0 V110 H0 Z">
      <animate attributeName="d"
               values="M0 46 q112 -26 225 0 t225 0 t225 0 t225 0 V110 H0 Z;
                       M0 46 q112 26 225 0 t225 0 t225 0 t225 0 V110 H0 Z;
                       M0 46 q112 -26 225 0 t225 0 t225 0 t225 0 V110 H0 Z"
               dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#00c2ff" fill-opacity="0.28"
          d="M0 64 q112 -22 225 0 t225 0 t225 0 t225 0 V110 H0 Z">
      <animate attributeName="d"
               values="M0 64 q112 22 225 0 t225 0 t225 0 t225 0 V110 H0 Z;
                       M0 64 q112 -22 225 0 t225 0 t225 0 t225 0 V110 H0 Z;
                       M0 64 q112 22 225 0 t225 0 t225 0 t225 0 V110 H0 Z"
               dur="7s" repeatCount="indefinite"/>
    </path>
    <text x="450" y="34" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14" fill="#9fb6c4">thanks for scrolling
      <tspan fill="#00c2ff"> — now go build something</tspan>
    </text>
  </g>
</svg>
