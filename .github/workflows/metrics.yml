# Generates the profile stat cards as SVGs committed into this repo, so the
# README serves them from raw.githubusercontent.com instead of depending on a
# shared public instance that is frequently rate limited.
#
# Works out of the box with the built-in GITHUB_TOKEN. For richer data
# (private-repo totals, full contribution calendar) add a classic PAT with the
# `read:user` and `repo` scopes as a repository secret named METRICS_TOKEN and
# this workflow will pick it up automatically.

name: Generate Profile Metrics

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview card
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Rohanx04
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes

      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Rohanx04
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
